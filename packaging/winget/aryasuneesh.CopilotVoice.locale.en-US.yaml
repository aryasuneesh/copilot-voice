ShortDescription: Turn the Copilot key into local push-to-talk dictation
Description: |-
  Hold the Copilot key, speak, let go. Whisper transcribes on-device and the
  text is pasted into the focused app. No account, no API key, and nothing
  leaves the machine after the model is downloaded.

  Setup runs a wizard: capture any key you like, choose hold-to-talk or
  tap-to-toggle, download a speech model with a progress bar, and test
  dictation before it touches your other apps.
